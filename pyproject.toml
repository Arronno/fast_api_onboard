[project]
name = "fast-api-onboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Farhan Shadique Arronno", email = "32240027+Arronno@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.0",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
fast-api-onboard = "fast_api_onboard:main"
[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
